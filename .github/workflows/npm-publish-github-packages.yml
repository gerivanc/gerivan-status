# gerivan.me — 24/7 DNS & uptime monitor
# Runs every 15 minutes, checks DNS propagation from 25 locations, HTTPS and
# TLS certificates, then publishes the results to the "data" branch, where
# https://gerivan.me/status.html reads them.
name: DNS monitor

on:
  schedule:
    - cron: '7,22,37,52 * * * *'   # every 15 min, off the busy top of the hour (UTC)
  workflow_dispatch: {}             # "Run workflow" button in the Actions tab

permissions:
  contents: write                   # push to the data branch
  issues: write                     # open/close incident issues (alerts)

concurrency:
  group: dns-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out monitor code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore previous results from the data branch
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch --depth=1 origin data
            git archive FETCH_HEAD | tar -x -C data
            echo "Restored: $(ls data | tr '\n' ' ')"
          else
            echo "No data branch yet — first run."
          fi

      - name: Run checks
        env:
          DATA_DIR: data
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node gerivan-status/monitor/check.mjs

      - name: Publish results to the data branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OVERALL=$(jq -r .overall data/status.json)
          cp -r data /tmp/publish && cd /tmp/publish
          cat > README.md <<'EOF'
          # Monitor data
          Generated automatically by `.github/workflows/dns-monitor.yml` on the main branch.
          Do not edit — this branch is overwritten on every run.
          EOF
          git init -q -b data
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "status: ${OVERALL} · $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # single-commit branch: force-push keeps the repository tiny forever
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          echo "### ${OVERALL}" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.reasons[]? | "- " + .' status.json >> "$GITHUB_STEP_SUMMARY" || true
